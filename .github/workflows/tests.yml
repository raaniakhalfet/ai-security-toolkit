name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python scanner/benign_test.py
      - run: python -m pytest -q tests
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # On GitHub the checkout belongs to another user than the containers, which have no extra Linux powers
      # (cap_drop ALL): let them write the shared files (alerts, kill switch...).
      - run: chmod -R a+rwX .
      - run: docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tests/docker_smoke.py
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml logs
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml down
